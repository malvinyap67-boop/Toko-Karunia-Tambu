{% extends 'base.html' %}
{% block title %}Login - Toko Karunia Tambu{% endblock %}
{% block login_content %}
<div class="min-h-screen flex items-center justify-center bg-surface px-4 relative">
    <div class="absolute inset-0 bg-gradient-to-br from-brand-fixed/40 via-surface to-brand/10"></div>
    <div class="relative w-full max-w-md bg-card rounded-2xl shadow-xl p-8 sm:p-10">
        <div class="flex flex-col items-center text-center">
            <img src="{{ url_for('static', filename='logo/logo.png') }}" alt="Logo Karunia Tambu" class="h-20 object-contain mb-4">
            <h1 class="text-3xl font-extrabold text-ink">Toko Karunia Tambu</h1>
            <p class="text-sm text-ink-variant mt-2">Sistem Manajemen Toko</p>
        </div>
        <form method="POST" class="mt-8 space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-ink-variant mb-2">Username</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-variant text-[20px]">person</span>
                    <input type="text" name="username" required autocomplete="username" placeholder="ID Pengguna"
                           class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant/60 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-ink-variant mb-2">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-variant text-[20px]">lock</span>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="Kata Sandi"
                           class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant/60 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand">
                </div>
            </div>
            <button type="submit" class="w-full flex items-center justify-center gap-2 bg-brand hover:bg-brand-light text-white font-bold py-3.5 rounded-lg transition-colors shadow-lg shadow-brand/30">
                Masuk <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
